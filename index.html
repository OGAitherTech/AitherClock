<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Aither Clock — a clean, modern clock for web and iPhone.">
  <title>Aither Clock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">A</span><span>Aither Clock</span></div>
      <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">Theme</button>
    </header>

    <section class="clock-card">
      <div class="date" id="date">Loading date…</div>
      <div class="digital" id="digital">00:00:00</div>
      <div class="period" id="period">AM</div>
      <div class="analog" aria-label="Analog clock">
        <div class="tick t12">12</div><div class="tick t3">3</div><div class="tick t6">6</div><div class="tick t9">9</div>
        <div class="hand hour" id="hourHand"></div><div class="hand minute" id="minuteHand"></div><div class="hand second" id="secondHand"></div><div class="pin"></div>
      </div>
    </section>

    <nav class="tabs" aria-label="Clock tools">
      <button class="tab active" data-panel="clockPanel">Clock</button>
      <button class="tab" data-panel="stopwatchPanel">Stopwatch</button>
      <button class="tab" data-panel="timerPanel">Timer</button>
    </nav>

    <section id="clockPanel" class="panel active-panel">
      <div class="settings-grid">
        <label>Time format<select id="format"><option value="12">12-hour</option><option value="24">24-hour</option></select></label>
        <label>Seconds<select id="seconds"><option value="show">Show seconds</option><option value="hide">Hide seconds</option></select></label>
      </div>
    </section>

    <section id="stopwatchPanel" class="panel">
      <div class="tool-display" id="stopwatch">00:00.00</div>
      <div class="controls"><button id="swStart" class="primary">Start</button><button id="swLap">Lap</button><button id="swReset">Reset</button></div>
      <ol id="laps" class="laps"></ol>
    </section>

    <section id="timerPanel" class="panel">
      <div class="timer-inputs"><input id="timerMin" type="number" min="0" max="999" value="5" aria-label="Minutes"><span>:</span><input id="timerSec" type="number" min="0" max="59" value="0" aria-label="Seconds"></div>
      <div class="tool-display" id="timerDisplay">05:00</div>
      <div class="controls"><button id="timerStart" class="primary">Start</button><button id="timerReset">Reset</button></div>
    </section>

    <footer>Runs locally in your browser. No account or data collection required.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
